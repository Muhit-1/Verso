name: Release

# Push a tag like v0.2.0 to build the installer and attach it to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without the v), e.g. 0.2.0"
        required: true

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Version
        id: v
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '${{ inputs.version }}' }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Test before shipping
        shell: pwsh
        run: |
          npm test
          dotnet test tests/Verso.App.Tests -c Release

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: ./installer/build.ps1 -Version ${{ steps.v.outputs.version }}

      # Unsigned installers trigger SmartScreen. To sign: add a code-signing certificate as repository secrets and a
      # signtool step here, before the upload. See docs/releasing.md.

      - uses: actions/upload-artifact@v4
        with:
          name: Verso-Setup-${{ steps.v.outputs.version }}
          path: artifacts/installer/Verso-Setup-*.exe

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/installer/Verso-Setup-*.exe
          generate_release_notes: true
