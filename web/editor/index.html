<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verso editor</title>
<link rel="stylesheet" href="../outpost/fonts/fonts.local.css">
<style>
  :root { --accent: #f2c94c; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #2b2b2b; color: #f4f4f4;
    font-family: 'Inter', system-ui, sans-serif; }
  body { display: flex; flex-direction: column; border: 2px solid var(--accent); }
  #body { flex: 1; padding: 12px 14px; font-size: .95rem; line-height: 1.4; outline: none; overflow: auto; user-select: text;
    word-break: break-word; cursor: text; }
  #body ul, #body ol { padding-left: 1.3em; }
  .tools { display: flex; align-items: center; gap: 4px; padding: 6px 10px; border-top: 1px solid #444; color: #ccc; flex: none; }
  .tools button { width: 30px; height: 26px; border-radius: 5px; font: inherit; font-size: .85rem; color: inherit;
    background: none; border: 0; cursor: pointer; }
  .tools button:hover { background: #444; }
  .tools button.on { background: #555; color: #fff; }
  .tools .sp { flex: 1; }
  .tools .done { width: auto; padding: 0 12px; background: var(--accent); color: #1a1a1a; font-weight: 600; font-size: .72rem;
    letter-spacing: .08em; text-transform: uppercase; }
  .tools .done:hover { filter: brightness(1.08); background: var(--accent); }
  body.single .tools { display: none; }
  body.single #body { white-space: nowrap; overflow: hidden; display: flex; align-items: center; font-size: 1.05rem; }
</style>
</head>
<body>
<div id="body" contenteditable="true" spellcheck="true"></div>
<div class="tools" id="tools">
  <button data-cmd="bold" title="Bold (Ctrl+B)"><b>B</b></button>
  <button data-cmd="italic" title="Italic (Ctrl+I)"><i>I</i></button>
  <button data-cmd="underline" title="Underline (Ctrl+U)"><u>U</u></button>
  <button data-cmd="strikeThrough" title="Strikethrough"><s>ab</s></button>
  <button data-cmd="insertUnorderedList" title="Bullet list">&bull;&equiv;</button>
  <span class="sp"></span>
  <button class="done" id="done" title="Esc">Done</button>
</div>
<script src="editor.js"></script>
</body>
</html>
