<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Water Ripple wallpaper</title>

<!--
  WATER RIPPLE — an interactive live wallpaper.

  Click anywhere and a ripple spreads from that point, the way one
  does on the surface of still water. Runs entirely on the GPU: the
  ripple math is a fragment shader, not a per-pixel JavaScript loop,
  which is what makes it smooth rather than a slideshow — the whole
  point of the "make it smooth" ask this was built for.

  Self-contained on purpose, per web/live wallpaper/README.md: a
  background is picked as one file from "Set background…", not loaded
  through the widget loader, so none of docs/widget-spec.md's rules
  apply here. No window.VersoHost, no permissions, no theme tokens —
  just a page that works wherever it's pointed at.
-->

<style>
  html, body{ margin:0; height:100%; overflow:hidden; background:#0B1416; }
  canvas{ display:block; width:100%; height:100%; cursor:pointer; }
  .fallback{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    color:#7C9198; font:14px system-ui, sans-serif; text-align:center; padding:24px;
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<script type="module">
  const canvas = document.getElementById("c");
  const gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");

  if (!gl) {
    document.body.innerHTML = '<p class="fallback">WebGL is not available, so this wallpaper cannot render. Any other page still works as a background.</p>';
  } else {
    start(gl);
  }

  function start(gl) {
    const MAX_RIPPLES = 12;

    const vertSrc = `
      attribute vec2 aPos;
      void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
    `;

    // Each ripple is a decaying, outward-travelling sine ring:
    //   ring      — the wave pattern itself, a function of distance and age
    //   envelope  — fades the ring out over both time and distance, and
    //               eases it in over the first fraction of a second so a
    //               fresh click does not pop in with a hard edge
    // Ripples are summed, then used to lighten (crest) or darken
    // (trough) a slowly shifting base gradient.
    const fragSrc = `
      precision highp float;
      uniform vec2 uResolution;
      uniform float uTime;
      uniform vec3 uDeep;
      uniform vec3 uMid;
      uniform vec3 uLume;
      uniform int uCount;
      uniform vec3 uRipples[${MAX_RIPPLES}]; // x, y (pixels), startTime

      void main() {
        vec2 uv = gl_FragCoord.xy;

        // A slow ambient drift, so the water is never perfectly still
        // even with nothing clicked yet.
        float ambient = sin((uv.x + uv.y) * 0.004 + uTime * 0.25) * 0.02;

        float wave = 0.0;
        for (int i = 0; i < ${MAX_RIPPLES}; i++) {
          if (i >= uCount) break;

          vec2 origin = uRipples[i].xy;
          float start = uRipples[i].z;
          float age = uTime - start;
          if (age < 0.0 || age > 4.0) continue;

          float dist = distance(uv, origin);
          float ring = sin(dist * 0.06 - age * 5.5);
          float envelope = exp(-age * 1.1) * exp(-dist * 0.0022) * smoothstep(0.0, 0.15, age);
          wave += ring * envelope;
        }

        float shade = ambient + wave * 0.5;
        vec3 base = mix(uDeep, uMid, 0.5 + 0.5 * sin(uv.y * 0.0015 + uTime * 0.05));
        vec3 color = base
          + uLume * max(shade, 0.0) * 0.9
          - uDeep * max(-shade, 0.0) * 0.4;

        gl_FragColor = vec4(color, 1.0);
      }
    `;

    function compile(type, src) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, src);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        console.error("Verso ripple wallpaper: shader failed to compile.", gl.getShaderInfoLog(shader));
      }
      return shader;
    }

    const program = gl.createProgram();
    gl.attachShader(program, compile(gl.VERTEX_SHADER, vertSrc));
    gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragSrc));
    gl.linkProgram(program);
    gl.useProgram(program);

    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    const aPos = gl.getAttribLocation(program, "aPos");
    gl.enableVertexAttribArray(aPos);
    gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

    const uResolution = gl.getUniformLocation(program, "uResolution");
    const uTime = gl.getUniformLocation(program, "uTime");
    const uDeep = gl.getUniformLocation(program, "uDeep");
    const uMid = gl.getUniformLocation(program, "uMid");
    const uLume = gl.getUniformLocation(program, "uLume");
    const uCount = gl.getUniformLocation(program, "uCount");
    const uRipples = gl.getUniformLocation(program, "uRipples");

    // A calm, deep-water palette in the spirit of Verso's own Smoked
    // Petrol theme — hardcoded rather than read from theme tokens,
    // because a background picked as a single file has no injected
    // stylesheet to read them from (see the file header).
    gl.uniform3f(uDeep, 0.043, 0.078, 0.086);
    gl.uniform3f(uMid, 0.071, 0.137, 0.145);
    gl.uniform3f(uLume, 0.624, 0.878, 0.769);

    let ripples = []; // {x, y, t}
    const startedAt = performance.now();
    const now = () => (performance.now() - startedAt) / 1000;

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(innerWidth * dpr);
      canvas.height = Math.floor(innerHeight * dpr);
      gl.viewport(0, 0, canvas.width, canvas.height);
    }
    window.addEventListener("resize", resize);
    resize();

    function addRipple(clientX, clientY) {
      const dpr = canvas.width / innerWidth;
      // WebGL's origin is bottom-left; pointer events are top-left.
      ripples.push({ x: clientX * dpr, y: (innerHeight - clientY) * dpr, t: now() });
      if (ripples.length > MAX_RIPPLES) ripples.shift();
    }

    canvas.addEventListener("pointerdown", e => addRipple(e.clientX, e.clientY));

    // One gentle ripple on load, so the wallpaper shows what it does
    // before anyone has clicked anything.
    addRipple(innerWidth * 0.5, innerHeight * 0.45);

    const flat = new Float32Array(MAX_RIPPLES * 3);

    function frame() {
      const t = now();
      ripples = ripples.filter(r => t - r.t < 4);

      gl.uniform2f(uResolution, canvas.width, canvas.height);
      gl.uniform1f(uTime, t);
      gl.uniform1i(uCount, ripples.length);

      ripples.forEach((r, i) => {
        flat[i * 3] = r.x;
        flat[i * 3 + 1] = r.y;
        flat[i * 3 + 2] = r.t;
      });
      gl.uniform3fv(uRipples, flat);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  }
</script>
</body>
</html>
