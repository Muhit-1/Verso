<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verso — Outpost desk</title>
<link rel="stylesheet" href="fonts/fonts.local.css">
<link rel="stylesheet" href="css/outpost.css">
</head>
<body data-theme="sunset">

<!--
  The desk is a shell plus independent widgets. This page holds only the shell: the wallpaper, the desk
  surface the widgets add themselves to, the arrange hint, the round menu and the toast. Every widget
  (js/widgets/*.js) builds its own elements. It lives in the wallpaper window, behind the desktop icons, so the
  host mirrors the mouse into it — see src/Verso.Interop/InputMirror.cs. Design: design/outpost-v3/.
-->
<div id="bg"></div>
<div class="scrim"></div>

<main class="desk" id="desk">
  <div class="guide x" id="gx"></div>
  <div class="guide y" id="gy"></div>

  <div class="hint" id="hint">
    <b>Arrange</b><span>Drag anything · cards also move by their title any time</span>
    <button class="btn" id="hReset">Reset layout</button><button class="btn primary" id="hDone">Done</button>
  </div>
</main>

<div class="menu" id="menu"></div>
<div class="toast" id="toast"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
