<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verso app picker</title>
<link rel="stylesheet" href="../outpost/fonts/fonts.local.css">
<style>
  :root { --accent: #ff9e64; --on: #1a0d08; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #2b2b2b; color: #f4f4f4; font-family: 'Inter', system-ui, sans-serif; }
  body { display: flex; flex-direction: column; border: 2px solid var(--accent); user-select: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .head { display: flex; align-items: center; gap: 12px; padding: 16px 18px 6px; }
  .head h2 { font-size: 1.05rem; font-weight: 600; flex: 1; }
  .head .to { font-size: .78rem; color: #aaa; display: flex; align-items: center; gap: 8px; }
  select { font: inherit; font-size: .8rem; background: #3a3a3a; color: #fff; border: 1px solid #555; border-radius: 8px; padding: 5px 8px; max-width: 170px; }
  .search { margin: 8px 18px 4px; display: flex; align-items: center; gap: 10px; background: #1f1f1f; border: 1px solid #444; border-radius: 10px; padding: 0 12px; }
  .search:focus-within { border-color: var(--accent); }
  .search svg { width: 16px; height: 16px; fill: none; stroke: #999; stroke-width: 2; stroke-linecap: round; flex: none; }
  .search input { flex: 1; background: none; border: 0; outline: 0; color: #fff; font: inherit; font-size: .95rem; padding: 11px 0; user-select: text; }
  .chips { display: flex; gap: 6px; padding: 8px 18px; flex: none; }
  .chip { padding: 5px 12px; border-radius: 999px; font-size: .74rem; background: #383838; color: #ccc; }
  .chip.on { background: var(--accent); color: var(--on); font-weight: 600; }
  .list { flex: 1; overflow: auto; padding: 0 8px 6px; scrollbar-width: thin; scrollbar-color: #555 transparent; }
  .sec { position: sticky; top: 0; background: #2b2b2b; font-size: .68rem; letter-spacing: .14em; color: var(--accent); padding: 8px 12px 4px; font-weight: 600; z-index: 1; }
  .row { display: flex; align-items: center; gap: 12px; padding: 7px 12px; border-radius: 10px; cursor: pointer; }
  .row:hover, .row.hl { background: #383838; }
  .aico { width: 34px; height: 34px; border-radius: 9px; font-size: .85rem; flex: none; display: grid; place-items: center; font-weight: 700; color: #fff; overflow: hidden; }
  .aico img { width: 100%; height: 100%; object-fit: contain; }
  .row .nm { flex: 1; font-size: .9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .tag { font-size: .66rem; color: #999; letter-spacing: .04em; white-space: nowrap; }
  .row .ck { width: 20px; height: 20px; border-radius: 6px; border: 2px solid #666; display: grid; place-items: center; flex: none; color: transparent; font-size: .8rem; font-weight: 700; }
  .row.sel .ck { background: var(--accent); border-color: var(--accent); color: var(--on); }
  .row.added { opacity: .45; cursor: default; }
  .row.added .ck { border-style: dashed; }
  .row.added .tag::after { content: " · already added"; }
  .none { padding: 36px 18px; text-align: center; color: #999; font-size: .9rem; line-height: 1.8; }
  .foot { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-top: 1px solid #444; background: #262626; flex: none; }
  .foot .sp { flex: 1; }
  .foot .cnt { font-size: .8rem; color: #aaa; }
  .btn { padding: 9px 16px; border-radius: 999px; font-size: .8rem; font-weight: 600; background: #3a3a3a; }
  .btn:hover { background: #4a4a4a; }
  .btn.primary { background: var(--accent); color: var(--on); }
  .btn.primary[disabled] { opacity: .4; cursor: default; }
  .btn.link { background: none; color: #cfcfcf; font-weight: 500; text-decoration: underline; padding-left: 2px; }
</style>
</head>
<body>
  <div class="head"><h2>Add apps</h2><div class="to">to <select id="target"></select></div></div>
  <div class="search">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="q" placeholder="Search your installed apps" autocomplete="off" spellcheck="false">
  </div>
  <div class="chips" id="chips"></div>
  <div class="list" id="list"></div>
  <div class="foot">
    <button class="btn link" id="browse">Browse for a file…</button>
    <span class="sp"></span>
    <span class="cnt" id="cnt">Nothing selected</span>
    <button class="btn" id="cancel">Cancel</button>
    <button class="btn primary" id="add" disabled>Add</button>
  </div>

<script src="picker.js"></script>
</body>
</html>
