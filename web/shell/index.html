<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verso</title>

<!--
  VERSO — a live wallpaper that is also a widget desk.

  This page is the shell: the ground, the minute track, and the
  loader that renders every widget (js/widgets.js) — including the
  clock, tasks and player, which used to be hardcoded here and now
  live in web/widgets/dial, web/widgets/tasks and web/widgets/player
  like any other widget. It is openable directly in a browser — no
  build step, no server needed — and it runs identically inside the
  native host, because everything it can do to the machine goes
  through the one bridge in js/host.js.

  LAYOUT
    Widgets are positioned and sized by js/layout.js, in fractions of
    the viewport, defaulting to a sensible first-run arrangement
    (js/widgets.js's DEFAULT_POSITIONS) until the user drags or
    resizes something. Nothing scrolls at the page level.

  THEME
    No colour is decided in this file or in css/. The palette comes
    from web/themes/<id>/theme.css, swapped at runtime by js/theme.js.
    Press T to cycle. See docs/theme-spec.md.

  HOST
    window.chrome.webview.hostObjects.VersoHost when the native host
    is present; a self-contained demo implementation otherwise. See
    docs/host-api.md.

  Fonts are injected by the theme, not linked here — which theme is
  active is not known until js/theme.js has run.
-->

<link rel="icon" type="image/png" href="favicon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/desk.css">
</head>
<body>

<div class="stage" aria-hidden="true"></div>

<div class="minute-track" id="minuteTrack" aria-hidden="true"></div>

<!-- Every widget — including the clock, tasks and player, which used
     to be hardcoded above this comment — is rendered here by
     js/widgets.js. The left edge stays clear of them by default:
     DEFAULT_POSITIONS in that file keeps that ground clear for the
     desktop icons, the way a dedicated grid column used to. -->

<!-- Shown for a moment after T is pressed, and at no other time. -->
<div class="theme-toast" id="themeToast" role="status" aria-live="polite">
  <span class="key">T</span>
  <span id="themeName">Smoked Petrol</span>
</div>

<script type="module" src="js/desk.js"></script>
</body>
</html>
